name: Deploy Algorithm Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-algoblog
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      # 兼容：如果输出在 .vitepress/dist 或 docs/.vitepress/dist，统一提到根目录 dist
      - name: Prepare dist directory
        run: |
          if [ -d ".vitepress/dist" ]; then
            cp -r .vitepress/dist ./dist
          elif [ -d "docs/.vitepress/dist" ]; then
            cp -r docs/.vitepress/dist ./dist
          fi

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "dist/"
          target: "/var/www/algoblog/dist"
          strip_components: 1
          rm: true