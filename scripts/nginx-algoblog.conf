# Algorithm Blog — Nginx Configuration
# Deploy to: /etc/nginx/sites-available/algoblog
# Then: sudo ln -s /etc/nginx/sites-available/algoblog /etc/nginx/sites-enabled/

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    server_name ac.fccc.xyz;
    return 301 https://$server_name$request_uri;
}

# --- HTTPS server ---
server {
    listen 443 ssl http2;
    server_name ac.fccc.xyz;

    ssl_certificate /etc/letsencrypt/live/ac.fccc.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ac.fccc.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    root /var/www/algoblog;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML files
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Sitemap
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Robots
    location = /robots.txt {
        add_header Cache-Control "public";
    }

    # 404
    error_page 404 /404.html;
}
